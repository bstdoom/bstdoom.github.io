# Keep the Roq site files in this module's project directory.
quarkus.roq.dir=.

# The static generator writes to build/roq by default for Gradle builds.
quarkus.roq.generator.output-dir=roq

# Keep the standalone sample separate from other local web projects.
quarkus.http.port=8082

# Use Roq's documented {=expression} syntax in templates.
quarkus.qute.alt-expr-syntax=true

quarkus.web-bundler.node-modules=build
