[versions]
commonmark = "0.31.0"
kotlin = "2.4.21"
quarkus = "3.40.1.1"
roq = "2.2.0"

[libraries]
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-kotlin = { module = "io.quarkus:quarkus-kotlin" }
quarkus-roq = { module = "io.quarkiverse.roq:quarkus-roq", version.ref = "roq" }
quarkus-vertx = { module = "io.quarkus:quarkus-vertx" }
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
